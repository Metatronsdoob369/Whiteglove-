name: Docs Health Check

on:
  schedule:
    - cron: '0 13 * * 1' # Weekly Monday 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  docs-health:
    name: Scheduled Docs Hygiene
    runs-on: ubuntu-latest
    # Secrets are hoisted to job env because the `secrets` context is not
    # available inside step `if:` expressions — referencing it there makes
    # the whole workflow file invalid, which GitHub reports as an instant
    # 0-second failure on EVERY push, regardless of this workflow's triggers.
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure ripgrep is available
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Run docs release checker
        id: docs_check
        continue-on-error: true
        run: bash scripts/docs_release_check.sh --no-ci

      - name: Create or update failure issue
        if: steps.docs_check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Docs Health Check Failure';
            const labels = ['docs-health', 'ci', 'maintenance'];
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const nowUtc = new Date().toISOString();
            const body = [
              '## Summary',
              '',
              'Automated docs health check failed and requires remediation before next release cycle.',
              '',
              '## Run Context',
              '',
              `- Workflow: ${context.workflow}`,
              `- Run: ${runUrl}`,
              `- Branch: ${context.ref.replace('refs/heads/', '')}`,
              `- Commit: ${context.sha}`,
              `- Failure timestamp (UTC): ${nowUtc}`,
              '',
              '## Failed Checks',
              '',
              '- [ ] Identify failing subsection(s) from workflow log',
              '',
              '## Root Cause',
              '',
              '<!-- Add root cause here -->',
              '',
              '## Remediation Plan',
              '',
              '1.',
              '2.',
              '3.',
              '',
              '## Verification',
              '',
              '- [ ] `bash scripts/docs_release_check.sh --no-ci` passes locally',
              '- [ ] PR with fix is opened',
              '- [ ] Required CI checks are green',
              '',
              'Please review and fix before the next release cycle.'
            ].join('\n');

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (err) {
                if (err.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label,
                    color: label === 'docs-health' ? 'B60205' : label === 'ci' ? '1D76DB' : '5319E7',
                  });
                } else {
                  throw err;
                }
              }
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'docs-health',
              per_page: 100,
            });

            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels,
              });
              core.info(`Created issue #${created.data.number}`);
            }

      - name: Notify Slack on failure
        if: steps.docs_check.outcome == 'failure' && env.SLACK_WEBHOOK_URL != ''
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          TEXT="Docs Health Check FAILED for ${REPO} on branch ${REF_NAME} at commit ${SHA}. Run: ${RUN_URL}"
          payload=$(python3 -c 'import json, os, sys; print(json.dumps({"text": sys.argv[1]}))' "$TEXT")
          curl -fsSL -X POST -H "Content-Type: application/json" -d "$payload" "$SLACK_WEBHOOK_URL"

      - name: Notify Teams on failure
        if: steps.docs_check.outcome == 'failure' && env.TEAMS_WEBHOOK_URL != ''
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          # jq, not a python heredoc: heredoc bodies must sit at column 0 for
          # python, but a column-0 line TERMINATES this YAML block scalar and
          # invalidates the whole workflow file. jq is indentation-neutral.
          payload=$(jq -n \
            --arg repo "$REPO" \
            --arg branch "$REF_NAME" \
            --arg sha "$SHA" \
            --arg url "$RUN_URL" \
            '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              summary: "Docs Health Check Failure",
              themeColor: "E81123",
              title: "Docs Health Check Failure",
              text: ("Docs Health Check FAILED for " + $repo + " on branch " + $branch + " at commit " + $sha + "."),
              sections: [
                { facts: [
                    { name: "Repository", value: $repo },
                    { name: "Branch", value: $branch },
                    { name: "Commit", value: $sha }
                ] }
              ],
              potentialAction: [
                {
                  "@type": "OpenUri",
                  name: "View Workflow Run",
                  targets: [ { os: "default", uri: $url } ]
                }
              ]
            }')
          curl -fsSL -X POST -H "Content-Type: application/json" -d "$payload" "$TEAMS_WEBHOOK_URL"

      - name: Fail workflow if check failed
        if: steps.docs_check.outcome == 'failure'
        run: |
          echo "Docs health check failed."
          exit 1
