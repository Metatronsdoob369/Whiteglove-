name: Quality Gates

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck (finalize-mvp Phase 1 gate)
        run: npx tsc --noEmit

      - name: Typecheck sub-projects (own tsconfigs)
        run: |
          set -euo pipefail
          (cd spectral-config && npm ci && npx tsc)
          (cd silence-harness-eval && npm ci && npx tsc)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run regression suites
        run: npm test

  x402-kernel:
    name: x402 Kernel (full test suite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spectral-x402
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        # Pinned to 20: better-sqlite3 v11 refuses newer majors (the morning
        # check needed the same pin — see commit 5be102e).
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: spectral-x402/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build kernel + gate scripts (fixture builders live in dist/ and dist-gate/)
        run: npx tsc && npx tsc -p tsconfig.gate.json

      - name: Build fixture packs (packs/ is gitignored; the suite loads sealed packs by edition)
        run: bash harness/ci-fixture-packs.sh

      - name: Run the kernel suite
        run: npm test

  config-drift:
    name: Manifest No-Drift Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spectral-config
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: spectral-config/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Regenerate into memory and byte-compare against committed manifests
        run: npm run check:drift

  finish-line:
    name: Finish Line (fixture corpus)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run finalize-mvp end-to-end on the committed fixture corpus
        run: WG_CORPUS=fixture WG_VERIFY=1 bash finalize-mvp.sh

  docs-release-hygiene:
    name: Docs Release Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure ripgrep is available
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Run docs release checker
        run: bash scripts/docs_release_check.sh --no-ci

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          set -euo pipefail
          TAG=$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${TAG}/gitleaks_${TAG#v}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository for secrets
        run: gitleaks dir . --redact --exit-code 1
